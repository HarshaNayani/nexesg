services:
  - type: web
    name: breathe-esg-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://breathe-esg-frontend-sp04.onrender.com
      - key: FIRST_ADMIN_EMAIL
        value: harshareddynayani@gmail.com
      # Set in the Render dashboard (sync: false keeps it out of the repo):
      - key: GOOGLE_CLIENT_ID
        sync: false
