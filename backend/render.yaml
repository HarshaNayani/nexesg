services:
  - type: web
    name: breathe-esg-backend
    env: python
    buildCommand: "pip install -r requirements.txt && cd backend && python manage.py migrate"
    startCommand: "cd backend && gunicorn backend.wsgi:application"
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.13.3s